<html>
<head>
    <title>CSS Grid Layout Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 85%;
            height: 500px;

            display: grid;
            grid-template-columns: 1fr 2.3fr 1fr;
            gap: 4px;

            background-color: black;
            border: 4px solid black;
            border-radius: 15px;
            overflow: hidden;
        }

        .left, .right {
            background-color: white;
        }

        .middle {
            display: grid;
            grid-template-rows: 1fr 1.1fr 1.1fr;
            gap: 4px;
            background-color: black;
        }

        .top {
            display: grid;
            grid-template-columns: 1fr 1.2fr 0.9fr;
            gap: 4px;
        }

        .center {
            display: grid;
            grid-template-columns: 2fr 0.9fr;
            gap: 4px;
        }

        .bottom {
            display: grid;
            grid-template-columns: 0.8fr 1.8fr;
            gap: 4px;
        }

        .box {
            background-color: white;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="left box"></div>

        <div class="middle">

            <div class="top">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="center">
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="bottom">
                <div class="box"></div>
                <div class="box"></div>
            </div>

        </div>

        <div class="right box"></div>

    </div>

</body>
</html>
